<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Royal Navy Gradients -->
    <linearGradient id="favNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Flame Torch Gradient -->
    <linearGradient id="favFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="favBook" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <path d="M 256 18 
           C 382 18, 452 44, 452 148 
           C 452 292, 382 432, 256 492 
           C 130 432, 60 292, 60 148 
           C 60 44, 130 18, 256 18 Z" 
        fill="url(#favNavy)" />

  <!-- Outer Gold Border Shield -->
  <path d="M 256 26 
           C 374 26, 442 50, 442 152 
           C 442 286, 376 420, 256 478 
           C 136 420, 70 286, 70 152 
           C 70 50, 138 26, 256 26 Z" 
        fill="none" 
        stroke="url(#favGold)" 
        stroke-width="16" />

  <!-- Sun Rays & Sun Core -->
  <circle cx="256" cy="148" r="44" fill="url(#favGold)" />
  <circle cx="256" cy="148" r="34" fill="#fef08a" />

  <!-- Torch Flame of Wisdom -->
  <path d="M 256 82 
           C 278 114, 286 130, 278 152 
           C 270 170, 242 170, 234 152 
           C 226 130, 234 114, 256 82 Z" 
        fill="url(#favFlame)" />
  <path d="M 256 104 
           C 266 122, 270 132, 266 146 
           C 262 156, 250 156, 246 146 
           C 242 132, 246 122, 256 104 Z" 
        fill="#ffffff" />

  <!-- Torch Base -->
  <rect x="246" y="158" width="20" height="24" rx="3" fill="url(#favGold)" stroke="#78350f" stroke-width="2" />

  <!-- Graduation Cap -->
  <polygon points="256,182 318,200 256,218 194,200" fill="url(#favGold)" stroke="#78350f" stroke-width="2" />
  <polygon points="256,186 310,200 256,214 202,200" fill="#1e1b4b" />
  <path d="M 216 208 L 216 226 C 216 238, 296 238, 296 226 L 296 208" fill="#1e1b4b" stroke="url(#favGold)" stroke-width="2" />
  <path d="M 310,202 Q 320,212 318,228" fill="none" stroke="url(#favGold)" stroke-width="3" />
  <circle cx="318" cy="230" r="4" fill="url(#favGold)" />

  <!-- Open Book of Knowledge -->
  <path d="M 256 256 
           C 292 236, 354 238, 396 254 
           L 396 342 
           C 354 326, 292 324, 256 344 
           C 220 324, 158 326, 116 342 
           L 116 254 
           C 158 238, 220 236, 256 256 Z" 
        fill="#0f172a" 
        stroke="url(#favGold)" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Left & Right Book Pages -->
  <path d="M 254 262 C 224 244, 170 246, 126 260 L 126 332 C 170 318, 224 316, 254 334 Z" fill="url(#favBook)" />
  <path d="M 258 262 C 288 244, 342 246, 386 260 L 386 332 C 342 318, 288 316, 258 334 Z" fill="url(#favBook)" />

  <!-- Page Lines -->
  <line x1="148" y1="278" x2="230" y2="274" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
  <line x1="148" y1="292" x2="230" y2="288" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
  <line x1="148" y1="306" x2="210" y2="302" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />

  <line x1="282" y1="274" x2="364" y2="278" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
  <line x1="282" y1="288" x2="364" y2="292" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
  <line x1="302" y1="302" x2="364" y2="306" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />

  <!-- Ribbon Banner: DIRD -->
  <path d="M 140 398 
           C 200 382, 312 382, 372 398 
           L 364 436 
           C 310 420, 202 420, 148 436 Z" 
        fill="url(#favGold)" 
        stroke="#78350f" 
        stroke-width="3" />

  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="22" 
        letter-spacing="3" 
        fill="#1e1b4b">
    DIRD
  </text>
</svg>

